# Drei Container aus einem Image:
#   steamhub          - der Webserver
#   steamhub-collect  - der Sammler im Dauerlauf (ersetzt cron/systemd-Timer)
#   steamhub-bot      - der Discord-Bot (optional, Profil "bot")
# Server und Sammler teilen sich das Volume mit der SQLite-Datei, der Bot
# spricht ausschliesslich ueber HTTP mit dem Server.
#
#   cp .env.example .env     # STEAM_API_KEY eintragen
#   docker compose up -d --build
#   docker compose logs -f steamhub-collect
#
# Mit Discord-Bot (braucht DISCORD_TOKEN und ADMIN_TOKEN in der .env):
#   docker compose --profile bot up -d --build

x-common: &common
  build: .
  image: steamhub:latest
  restart: unless-stopped
  env_file: [.env]
  # Diese vier gewinnen bewusst gegen die .env: im Container liegen die Daten
  # im Volume unter /data, und der Server muss auf allen Interfaces lauschen.
  environment:
    DB_PATH: /data/steamhub.db
    PLAYERS_FILE: /data/players.json
    HOST: 0.0.0.0
    PORT: "8077"
  volumes:
    - steamhub-data:/data

services:
  steamhub:
    <<: *common
    container_name: steamhub
    ports:
      # Nur auf localhost binden - nach aussen geht es ueber deinen nginx.
      # Wenn nginx selbst ein Container ist: diese zwei Zeilen weglassen und
      # stattdessen das gemeinsame Netzwerk unten aktivieren.
      - "127.0.0.1:8077:8077"
    # networks: [web]

  steamhub-collect:
    <<: *common
    container_name: steamhub-collect
    # alle 30 Minuten sammeln, erster Lauf sofort beim Start
    command: ["python", "-m", "app.collect", "--interval", "1800"]
    # Der Healthcheck im Image fragt den Webserver ab - den gibt es hier nicht.
    healthcheck:
      disable: true
    depends_on:
      - steamhub

  # Nur mit "--profile bot" - ohne DISCORD_TOKEN wuerde der Container sonst in
  # eine Neustartschleife laufen. Die Webhook-Meldungen aus dem Sammellauf
  # brauchen ihn nicht, die haengen allein an DISCORD_WEBHOOK_URL.
  steamhub-bot:
    <<: *common
    container_name: steamhub-bot
    profiles: ["bot"]
    environment:
      DB_PATH: /data/steamhub.db
      PLAYERS_FILE: /data/players.json
      HOST: 0.0.0.0
      PORT: "8077"
      # Im Container-Netz heisst der Server so - nicht localhost.
      HUB_URL: http://steamhub:8077
    command: ["python", "-m", "bot.bot"]
    healthcheck:
      disable: true
    depends_on:
      - steamhub

volumes:
  steamhub-data:

# Falls dein nginx ebenfalls als Container laeuft: das vorhandene Netzwerk
# hier eintragen, oben bei steamhub aktivieren und die ports-Zeile entfernen.
# Der nginx spricht den Dienst dann unter http://steamhub:8077 an.
#
# networks:
#   web:
#     external: true
#     name: <name-deines-nginx-netzwerks>
