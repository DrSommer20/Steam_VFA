# /etc/nginx/sites-available/steamhub  ->  symlink nach sites-enabled
#
# TLS-Zertifikat am einfachsten per certbot:
#   sudo certbot --nginx -d hub.deine-domain.de

server {
    listen 80;
    listen [::]:80;
    server_name hub.deine-domain.de;

    # certbot ergaenzt hier die Weiterleitung auf https
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.deine-domain.de;

    ssl_certificate     /etc/letsencrypt/live/hub.deine-domain.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.deine-domain.de/privkey.pem;

    # Der Hub zeigt Spielzeiten und Profile eurer Runde - nicht ins offene Netz stellen.
    # Passwortdatei anlegen:  sudo htpasswd -c /etc/nginx/.htpasswd-steamhub timmi
    auth_basic           "Steam Group Hub";
    auth_basic_user_file /etc/nginx/.htpasswd-steamhub;

    access_log /var/log/nginx/steamhub.access.log;
    error_log  /var/log/nginx/steamhub.error.log;

    location / {
        # Docker mit Port-Mapping (127.0.0.1:8077:8077) oder nativer Dienst:
        proxy_pass         http://127.0.0.1:8077;
        # nginx laeuft selbst als Container im selben Netzwerk? Dann stattdessen:
        # proxy_pass       http://steamhub:8077;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Statisches Zeug darf der Browser cachen
    location /static/ {
        proxy_pass       http://127.0.0.1:8077/static/;
        proxy_set_header Host $host;
        expires          1h;
        add_header       Cache-Control "public";
    }
}
